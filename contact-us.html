<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact Us · My Book Life</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        background: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .page {
        position: relative;
        width: min(100vw, 1076px);
        display: flex;
        flex-direction: column;
      }

      .layout-stage {
        position: relative;
        width: 100%;
        aspect-ratio: 1076 / 607;
        overflow: hidden;
        background: url("layout/contact-us.jpeg") center / 100% 100% no-repeat;
      }

      .header-overlay {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: auto;
        z-index: 3;
        user-select: none;
        pointer-events: none;
      }

      .site-footer {
        position: relative;
        width: 100%;
      }

      .footer-img {
        display: block;
        width: 100%;
        height: auto;
        user-select: none;
        pointer-events: none;
      }

      .hotspot {
        position: absolute;
        display: block;
        z-index: 5;
        border-radius: 10px;
      }

      .hotspot:focus-visible {
        outline: 3px solid rgba(241, 44, 166, 0.75);
        outline-offset: 3px;
      }

      @media (max-width: 900px) {
        body {
          justify-content: flex-start;
          overflow-x: auto;
        }

        .page {
          width: 1076px;
          max-width: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <main class="layout-stage" aria-label="Contact Us">
        <img class="header-overlay" src="assets/slices/site-header.png" alt="" draggable="false" />

        <a class="hotspot" href="index.html" aria-label="Home (logo)" style="left: 3%; top: 1%; width: 15%; height: 7.5%"></a>
        <a class="hotspot" href="index.html" aria-label="Home" style="left: 31%; top: 2%; width: 6.5%; height: 6%"></a>
        <a class="hotspot" href="about-us.html" aria-label="About Us" style="left: 39%; top: 2%; width: 7.5%; height: 6%"></a>
        <a class="hotspot" href="book-clubs.html" aria-label="Book Clubs" style="left: 48%; top: 2%; width: 8.5%; height: 6%"></a>
        <a class="hotspot" href="#" aria-label="My Space" style="left: 58%; top: 2%; width: 7.5%; height: 6%"></a>
        <a class="hotspot" href="#" aria-label="Reading Nooks" style="left: 66%; top: 2%; width: 10.5%; height: 6%"></a>
        <a class="hotspot" href="contact-us.html" aria-label="Contact Us" style="left: 78%; top: 2%; width: 8.5%; height: 6%"></a>
        <a class="hotspot" href="#" aria-label="Sign In" style="left: 89%; top: 1.5%; width: 8.5%; height: 6.5%; border-radius: 999px"></a>

        <a class="hotspot" href="#" aria-label="Already part of a BookMyLife book club?" style="left: 50%; top: 31%; width: 43.5%; height: 18%"></a>
        <a class="hotspot" href="#" aria-label="Want to join us as a partner?" style="left: 50%; top: 56%; width: 43.5%; height: 16%"></a>

        <a class="hotspot" href="#" aria-label="Reader Support" style="left: 53%; top: 79%; width: 14.5%; height: 11%; border-radius: 999px"></a>
        <a class="hotspot" href="#" aria-label="Authors" style="left: 68.5%; top: 79%; width: 11%; height: 11%; border-radius: 999px"></a>
        <a class="hotspot" href="#" aria-label="Publishers" style="left: 80.5%; top: 79%; width: 12%; height: 11%; border-radius: 999px"></a>
      </main>

      <footer class="site-footer" aria-label="Site footer">
        <img class="footer-img" src="assets/site-footer.png" alt="" draggable="false" />
        <a class="hotspot" href="index.html" aria-label="BookMyLife home" style="left: 5%; top: 30%; width: 13%; height: 45%"></a>
        <a class="hotspot" href="mailto:hello@bookmylife.com" aria-label="Email hello@bookmylife.com" style="left: 41%; top: 35%; width: 15%; height: 35%"></a>
        <a class="hotspot" href="tel:+15551234567" aria-label="Call +1 (555) 123-4567" style="left: 58%; top: 35%; width: 13%; height: 35%"></a>
      </footer>
    </div>
  </body>
</html>
