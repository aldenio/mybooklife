<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact Us · My Book Life</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        background: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .layout-stage {
        position: relative;
        width: min(100vw, 1076px);
        aspect-ratio: 1076 / 607;
        overflow: hidden;
        background: url("layout/contact-us.jpeg") center / 100% 100% no-repeat;
      }

      .hotspot {
        position: absolute;
        display: block;
        z-index: 5;
        border-radius: 10px;
      }

      .hotspot:focus-visible {
        outline: 3px solid rgba(241, 44, 166, 0.75);
        outline-offset: 3px;
      }

      @media (max-width: 900px) {
        body {
          justify-content: flex-start;
          overflow-x: auto;
        }

        .layout-stage {
          width: 1076px;
          max-width: none;
        }
      }
    </style>
  </head>
