<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reading Nooks · My Book Life</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        background: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .page {
        position: relative;
        width: min(100vw, 1672px);
        display: flex;
        flex-direction: column;
      }

      .bar {
        position: relative;
        width: 100%;
      }

      .bar > img {
        display: block;
        width: 100%;
        height: auto;
        user-select: none;
      }

      .hotspot {
        position: absolute;
        display: block;
        z-index: 5;
        border-radius: 10px;
      }

      .hotspot:focus-visible {
        outline: 3px solid rgba(241, 44, 166, 0.75);
        outline-offset: 3px;
      }

      @media (max-width: 900px) {
        body {
          justify-content: flex-start;
          overflow-x: auto;
        }

        .page {
          width: 1672px;
          max-width: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="bar">
        <img src="layout/MENU-PRINCIPAL-readingnooks.png" alt="" draggable="false" />
        <a class="hotspot" href="index.html" aria-label="Home (logo)" style="left: 2%; top: 15%; width: 16%; height: 70%"></a>
        <a class="hotspot" href="index.html" aria-label="Home" style="left: 31%; top: 25%; width: 6.5%; height: 55%"></a>
        <a class="hotspot" href="about-us.html" aria-label="About Us" style="left: 39%; top: 25%; width: 7.5%; height: 55%"></a>
        <a class="hotspot" href="book-clubs.html" aria-label="Book Clubs" style="left: 48%; top: 25%; width: 8.5%; height: 55%"></a>
        <a class="hotspot" href="myspace.html" aria-label="My Space" style="left: 58%; top: 25%; width: 7.5%; height: 55%"></a>
        <a class="hotspot" href="readingnooks.html" aria-label="Reading Nooks" style="left: 66%; top: 25%; width: 10.5%; height: 55%"></a>
        <a class="hotspot" href="contact-us.html" aria-label="Contact Us" style="left: 77%; top: 25%; width: 9%; height: 55%"></a>
        <a class="hotspot" href="#" aria-label="Sign In" style="left: 89%; top: 18%; width: 8.5%; height: 64%; border-radius: 999px"></a>
      </header>

      <main class="bar">
        <img src="layout/body-ReadingNooks.png" alt="" draggable="false" />
      </main>

      <footer class="bar">
        <img src="layout/footer.png" alt="" draggable="false" />
        <a class="hotspot" href="index.html" aria-label="BookMyLife home" style="left: 2%; top: 25%; width: 14%; height: 50%"></a>
        <a class="hotspot" href="mailto:hello@bookmylife.com" aria-label="Email hello@bookmylife.com" style="left: 45%; top: 30%; width: 18%; height: 45%"></a>
        <a class="hotspot" href="tel:+15551234567" aria-label="Call +1 (555) 123-4567" style="left: 63%; top: 30%; width: 13%; height: 45%"></a>
      </footer>
    </div>
  </body>
</html>
