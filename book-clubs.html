    <style>
      * {

      }

      html,

        margin: 0;
        min-height: 100%;

      body {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        background: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .page {
        position: relative;
        width: min(100vw, 1075px);
        display: flex;
        flex-direction: column;
      }

      .layout-stage {
        position: relative;
        width: 100%;
        aspect-ratio: 1075 / 606;
        overflow: hidden;
        background: url("layout/book-clubs.jpeg") center / 100% 100% no-repeat;
      }

      .header-overlay {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: auto;
        z-index: 3;
        user-select: none;
        pointer-events: none;
      }

      .site-footer {
        position: relative;
        width: 100%;
      }

      .footer-img {
        display: block;
        width: 100%;
        height: auto;
        user-select: none;
        pointer-events: none;
      }

      .hotspot {
        position: absolute;
        display: block;
        z-index: 5;
        border-radius: 10px;
      }

      .hotspot:focus-visible {
        outline: 3px solid rgba(241, 44, 166, 0.75);
        outline-offset: 3px;
      }

      @media (max-width: 900px) {
        body {
          justify-content: flex-start;
          overflow-x: auto;
        }

        .page {
          width: 1075px;
          max-width: none;
        }
      }
    </style>
  </head>
