    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        background: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .page {
        position: relative;
        width: min(100vw, 1672px);
        display: flex;
        flex-direction: column;
      }

      .layout-stage {
        position: relative;
        width: 100%;
        aspect-ratio: 1672 / 941;
        overflow: hidden;
        background: url("Layout.png") center / 100% 100% no-repeat;
      }

      .site-footer {
        position: relative;
        width: 100%;
      }

      .footer-img {
        display: block;
        width: 100%;
        height: auto;
        user-select: none;
        pointer-events: none;
      }

      .slice,
      .hotspot {
        position: absolute;
        display: block;
      }

      .slice {
        pointer-events: none;
        user-select: none;
      }

      .hotspot {
        z-index: 5;
        border-radius: 10px;
      }

      .hotspot:focus-visible {
        outline: 3px solid rgba(241, 44, 166, 0.75);
        outline-offset: 3px;
      }

      .header {
        left: 0;
        top: 0;
        width: 100%;
        height: auto;
        z-index: 3;
      }

      .hero {
        left: 5.0239%;
        top: 15.4091%;
        width: 29.9043%;
        height: 38.8959%;
      }

      .club {
        left: 40.9689%;
        top: 12.1148%;
        width: 50.8373%;
        height: 42.0829%;
      }

      .carousel {
        position: absolute;
        display: block;
        overflow: hidden;
        z-index: 2;
        border-radius: 22px;
        box-shadow: 0 20px 45px rgba(36, 18, 58, 0.14);
      }

      .carousel-track {
        display: flex;
        width: 400%;
        height: 100%;
        animation: carousel-slide 18s infinite;
      }

      .carousel-track img {
        width: 25%;
        height: 100%;
        flex: 0 0 25%;
        object-fit: fill;
        display: block;
        user-select: none;
        pointer-events: none;
      }

      @keyframes carousel-slide {
        0%,
        20% {
          transform: translateX(0);
        }

        30%,
        50% {
          transform: translateX(-25%);
        }

        60%,
        80% {
          transform: translateX(-50%);
        }

        90%,
        100% {
          transform: translateX(-75%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .carousel-track {
          animation: none;
        }
      }

      .authors {
        left: 5.0239%;
        top: 57.0669%;
        width: 43.6603%;
        height: 24.761%;
      }

      .calendar {
        left: 50.8373%;
        top: 57.0669%;
        width: 40.8493%;
        height: 27.0988%;
      }

      .features {
        left: 4.7847%;
        top: 83.1031%;
        width: 41.866%;
        height: 15.5154%;
      }

      .nook {
        left: 48.8636%;
        top: 85.6536%;
        width: 44.1388%;
        height: 12.9649%;
      }

      @media (max-width: 900px) {
        body {
          justify-content: flex-start;
          overflow-x: auto;
        }

        .page {
          width: 1672px;
          max-width: none;
        }
      }
    </style>
  </head>

    <script>
      function loadCalendarImage() {
        const calendarImage = document.querySelector("#calendar-image");
        const today = new Date();
        const month = today.getMonth();
        const day = String(today.getDate()).padStart(2, "0");

        if (month === 5) {
          calendarImage.src = `assets/calendars/june-${day}.png`;
          return;
        }

        const mayDay = String(Math.min(today.getDate(), 31)).padStart(2, "0");
        calendarImage.src = `assets/calendars/may-${mayDay}.png`;
      }

      loadCalendarImage();
    </script>
